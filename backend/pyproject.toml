[project]
name = "biodna-backend"
version = "1.0.0"
description = "High-Performance Bioinformatics Backend for DNA Pattern Identification and Mutation Detection"
authors = [{ name = "Bioinformatics Engineering Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "numpy>=2.1.2",
    "biopython>=1.84",
    "python-multipart>=0.0.12",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

